<!DOCTYPE html>
<html>
    <head>
        <title>SWiTCH | Games</title>
        <link rel="icon" href="../1img/logoS-W.png" type="image/png">
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap');
        </style>
    </head>
    <body>
        <header>
            <a href="../home/index.html" class="logo-link">
                <img src="../1img/logoL.png" alt="SWiTCH Logo" class="headerlogo logo-default">
                <img src="../1img/logoL-F.png" alt="SWiTCH Logo" class="headerlogo logo-hover">
            </a>
            <nav>
                <a class="news" href="../news/index.html">News</a>
                <a class="about" href="../aboutus/index.html">About Us</a>
                <a class="help" href="../help-contact/index.html">Help & Contact</a>
            </nav>
            <div class="profile-dropdown">
                <img src="../1img/profilepic-R.png" alt="Profile Picture" class="profilepic" onclick="toggleDropdown()">
                <div id="dropdown-menu" class="dropdown-content">
                    <a href="../profile/index.html">My Profile</a>
                    <a href="../settings/index.html">Settings</a>
                    <a href="../logout/index.html">Sign Out</a>
                </div>
            </div>
        </header>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <input type="text" placeholder="Search..." class="search-bar"><br>

            <hr class="sidelines" style="border-color: #696969;">
            <a href="../all/index.html" class="sidebar-link">All</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../windows/index.html" class="sidebar-link" style="color: #c0a8a8;">Windows Apps</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../steam/index.html" class="sidebar-link">Steam</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../epicgames/index.html" class="sidebar-link">Epic Games</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../rockstar/index.html" class="sidebar-link">Rockstar Games</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../ubisoft/index.html" class="sidebar-link">Ubisoft</a><hr class="sidelines" style="border-color: #696969;">
            <a href="../riot/index.html" class="sidebar-link">Riot Games</a><hr class="sidelines" style="border-color: #696969;">
            
            <button type="button" class="add-game-btn" onclick="openAddGameModal()">+ Add Custom Game</button>

            <div id="ftrs">
                <a href="../legal/index.html" class="footer-sidebar">Legal Notice</a>
                <a href="../privacy/index.html" class="footer-sidebar">Privacy Policy</a>
                <a href="../terms/index.html" class="footer-sidebar">Terms & Conditions</a>
                <span class="footer-sidebar-copyright">© 2026 SWiTCH, All rights reserved</span>
            </div>
        </div>

        <!-- Hidden File-Input for Cover Upload -->
        <input type="file" id="cover-upload-input" style="display: none;" accept="image/*" onchange="handleImageUpload(event)">

        <!-- Main Content Area -->
        <div class="main-content">
            <div id="games-grid" class="games-grid"></div>
        </div>

        <!-- Modal zum manuellen Hinzufügen -->
        <div id="add-game-modal" class="modal">
            <div class="modal-content">
                <h3>Add Game Manually</h3>
                <input type="text" id="custom-title" placeholder="Game Title">
                <input type="text" id="custom-path" placeholder="Path (.exe or steam://...)">
                <input type="text" id="custom-cover" placeholder="Cover Image URL (optional)">
                <div class="modal-buttons">
                    <button type="button" onclick="saveCustomGame()">Save</button>
                    <button type="button" onclick="closeAddGameModal()" class="cancel">Cancel</button>
                </div>
            </div>
        </div>
    </body>
</html>
